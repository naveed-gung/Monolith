name: Android Build & Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - '**'
    paths:
      - 'lib/**'
      - 'android/**'
      - 'third_party/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/android.yml'
      - '.github/patches/**'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: flutter pub get

      # Same phosphor_flutter 2.1.0 / Flutter 3.44 patch as the iOS workflow —
      # this is a pure-Dart compile fix, so it's required for the Android build
      # too. NOTE: GNU sed (Linux) takes `sed -i 's/.../.../'` with no '' arg,
      # unlike the BSD/macOS `sed -i ''` used in ios.yml.
      - name: Patch phosphor_flutter for Flutter 3.44
        run: |
          set -euo pipefail
          ROOT="$HOME/.pub-cache/hosted/pub.dev/phosphor_flutter-2.1.0"
          PKG="$ROOT/lib/src"
          if [ ! -d "$PKG" ]; then
            echo "ERROR: phosphor_flutter not found at $PKG"
            ls "$HOME/.pub-cache/hosted/pub.dev/" | grep phosphor || echo "(no phosphor entries)"
            exit 1
          fi
          cp .github/patches/phosphor_icon_data_flutter344.dart "$PKG/phosphor_icon_data.dart"
          cp .github/patches/phosphor_icon_flutter344.dart      "$PKG/phosphor_icon.dart"
          while IFS= read -r f; do
            head -1 "$f" | grep -q '^// @dart=' && continue
            { printf '// @dart=3.3\n'; cat "$f"; } > "${f}.tmp" && mv "${f}.tmp" "$f"
          done < <(find "$ROOT/lib" -name "*.dart")
          for style in regular thin light bold fill duotone; do
            sed -i 's/static const /static final /g' "$PKG/phosphor_icons_${style}.dart"
          done

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK to monolith.apk
        run: |
          set -eo pipefail
          cp build/app/outputs/flutter-apk/app-release.apk monolith.apk
          ls -lh monolith.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Monolith-Android
          path: monolith.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: monolith.apk
          fail_on_unmatched_files: true
          append_body: true
          body: |
            ## Android — `monolith.apk`

            - **App:** Monolith
            - **Version:** ${{ github.ref_name }}
            - **Package:** `dev.naveed_gung.monolith`
            - **Developer:** naveed-gung
            - **Min SDK:** 24 (Android 7.0)  ·  **ABI:** arm64-v8a

            Install directly on any Android 7.0+ device (enable "Install from
            unknown sources" if prompted).

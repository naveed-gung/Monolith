name: iOS Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.2) — leave blank to use current commit'
        required: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # needed to create/update GitHub Releases

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 40

    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods/repos
            ~/Library/Caches/CocoaPods
            ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock', 'pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Install dependencies
        run: flutter pub get

      - name: Precache iOS artifacts
        run: flutter precache --ios

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: Build unsigned iOS app (no code signing required)
        run: |
          set -eo pipefail
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee xcodebuild.log
          grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" xcodebuild.log | tail -20
          grep -q "BUILD SUCCEEDED" xcodebuild.log

      - name: Package unsigned IPA
        run: |
          set -eo pipefail
          APP=$(find "$RUNNER_TEMP/DerivedData" -name "Runner.app" -path "*/Release-iphoneos/*" | head -1)
          echo "Packaging: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "Monolith-${{ github.ref_name }}-unsigned.ipa" Payload
          rm -rf Payload

      - name: Upload IPA as workflow artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: Monolith-iOS-unsigned
          path: Monolith-*-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      # Only publish to GitHub Releases when triggered by a version tag
      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Monolith-*-unsigned.ipa
          fail_on_unmatched_files: true
          body: |
            ## iOS (unsigned IPA)

            This IPA is **not App Store signed**. Install via AltStore, Sideloadly, or
            any sideloading tool of your choice.

            > **Note:** You will need to re-sign it with your own Apple ID Developer
            > certificate before it can run on a physical device.

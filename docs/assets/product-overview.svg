  <text x="100" y="132" fill="#F4F7F8" font-size="42" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Monolith Product Surface</text>
  <text x="100" y="170" fill="#91AFB5" font-size="19" font-family="Segoe UI, Arial, sans-serif">Offline-first playback, shared Flutter UI, and platform-native media controls.</text>


  <text x="892" y="326" fill="#D6C2B2" font-size="18" font-family="Segoe UI, Arial, sans-serif">Animate the player, publish MediaItem</text>
  <text x="892" y="352" fill="#D6C2B2" font-size="18" font-family="Segoe UI, Arial, sans-serif">metadata, and expose system controls.</text>

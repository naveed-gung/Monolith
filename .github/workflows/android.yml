name: Android Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.4) — leave blank to use current commit'
        required: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: true
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2560m -Dorg.gradle.parallel=false -Dorg.gradle.workers.max=2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      # SIGNING: every release must use the one stable key in repository
      # secrets. A per-run generated debug key (used up to v1.5.0) gave each
      # APK a different signature, so Android refused to update installs.
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* || -n "$INPUT_TAG" ]]; then
              echo "ANDROID_KEYSTORE_BASE64 secret missing — refusing to publish an APK that cannot update installs."
              exit 1
            fi
            echo "No release keystore — build-only run falls back to the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/monolith-release.jks"
          echo "MONOLITH_KEYSTORE=$RUNNER_TEMP/monolith-release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          MONOLITH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MONOLITH_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Rename APK
        run: |
          APK=$(find build -name "*.apk" -type f | head -n 1)
          if [ -z "$APK" ]; then
            echo "No APK found in build directory"
            exit 1
          fi
          echo "Found APK: $APK"
          cp "$APK" monolith.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Monolith-Android
          path: monolith.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      # A release is cut ONLY for a v* tag, or for a workflow_dispatch that names
      # one. A plain push to main still builds and uploads the workflow artifact,
      # but must never touch an already published release: before this gate, a
      # main push with an unbumped pubspec resolved to the CURRENT version's tag
      # and overwrote that release's assets in place (v1.4.4, 2026-09-19).
      - name: Resolve release tag
        id: app_version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -eo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="$INPUT_TAG"
          fi
          if [[ -z "$TAG" ]]; then
            echo "No release tag — build only, nothing will be published."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          re='^v[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ ! "$TAG" =~ $re ]]; then
            echo "Refusing to publish to malformed tag: $TAG"
            exit 1
          fi
          PUBSPEC="v$(grep '^version: ' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d '[:space:]')"
          if [[ "$TAG" != "$PUBSPEC" ]]; then
            echo "Tag $TAG does not match pubspec version $PUBSPEC — bump pubspec.yaml first."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Releases
        if: steps.app_version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.app_version.outputs.tag }}
          name: "Monolith ${{ steps.app_version.outputs.tag }}"
          files: monolith.apk
          fail_on_unmatched_files: true
          append_body: true
          body: |
            ## Android — `monolith.apk`

            - **App:** Monolith
            - **Version:** ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.app_version.outputs.tag }}
            - **Min Android:** 7.0 (API 24)
            - **Bundle ID:** `dev.naveed_gung.monolith`

            Install on any Android 7.0+ device: download `monolith.apk`, then
            enable **Install unknown apps** for your browser/file manager when
            prompted. No Play Store account needed.

            > **Note:** signed with Monolith's stable release key, so later
            > versions install over this one. Upgrading from v1.5.0 or older
            > (debug-signed) needs one uninstall/reinstall. Android may warn
            > it's from an unknown developer — expected for a non–Play Store APK.

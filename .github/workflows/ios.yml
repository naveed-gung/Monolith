name: iOS Build & Release

# Tags only — one run per release. Triggering on branches AND tags meant a
# commit + its tag pushed together fired two runs; tags-only gives exactly one.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.2) — leave blank to use current commit'
        required: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 15

    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods/repos
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pods-


      - name: Install dependencies
        run: flutter pub get

      # phosphor_flutter 2.1.0 uses 'extends IconData' which became illegal in
      # Flutter 3.44 (IconData is now a final class). Three-part patch:
      #   1. phosphor_icon_data.dart  — extension types replacing class hierarchy.
      #      PhosphorDuotoneIconData implements PhosphorIconData (not just IconData)
      #      so phosphor_icons_base.dart return types (PhosphorIconData) are satisfied.
      #   2. phosphor_icon.dart       — duotone 'is' check removed (ext-type erasure
      #                                  makes it always-true at runtime)
      #   3. Generated icon files     — 'static const' → 'static final' because
      #                                  non-const ext-type constructors can't be const
      - name: Patch phosphor_flutter for Flutter 3.44
        run: |
          set -euo pipefail
          ROOT="$HOME/.pub-cache/hosted/pub.dev/phosphor_flutter-2.1.0"
          PKG="$ROOT/lib/src"
          if [ ! -d "$PKG" ]; then
            echo "ERROR: phosphor_flutter not found at $PKG"
            ls "$HOME/.pub-cache/hosted/pub.dev/" | grep phosphor || echo "(no phosphor entries)"
            exit 1
          fi
          # Patch 1: replace the two core source files with Flutter-3.44-compatible versions.
          # Both patch files already carry '// @dart=3.3' so extension types are enabled
          # for those files regardless of the package's pubspec.yaml SDK minimum.
          cp .github/patches/phosphor_icon_data_flutter344.dart "$PKG/phosphor_icon_data.dart"
          cp .github/patches/phosphor_icon_flutter344.dart      "$PKG/phosphor_icon.dart"
          # Patch 2: every remaining source file (barrel + icon files + base file) needs
          # '// @dart=3.3' so the Dart compiler enables extension types for those files too.
          # Without this, the package's pre-3.3 pubspec.yaml SDK minimum keeps them at
          # language version 2.12, which disables extension types and causes cascading
          # "Can't create typedef from non-function type" errors at every icon call site.
          while IFS= read -r f; do
            head -1 "$f" | grep -q '^// @dart=' && continue
            { printf '// @dart=3.3\n'; cat "$f"; } > "${f}.tmp" && mv "${f}.tmp" "$f"
          done < <(find "$ROOT/lib" -name "*.dart")
          # Patch 3: extension type constructors cannot be 'const'; change to 'final'.
          for style in regular thin light bold fill duotone; do
            sed -i '' 's/static const /static final /g' "$PKG/phosphor_icons_${style}.dart"
          done

      # Hybrid build: let Flutter do the CONFIGURATION only (pub get, Swift
      # Package Manager integration, and the correct `pod install` that exposes
      # every plugin pod module — this is what fixes "Module 'audio_service'
      # not found"), then drive `xcodebuild` directly so signing is genuinely
      # disabled. Plain `flutter build ios --no-codesign` compiles fine here
      # but still aborts at Flutter's own "requires a Development Team" gate;
      # raw xcodebuild on the Flutter-configured workspace skips that gate.
      # --no-tree-shake-icons is REQUIRED: the phosphor_flutter patch turns the
      # icon constructors from `static const` into `static final` (extension-type
      # constructors can't be const), and Flutter's icon tree-shaker rejects
      # non-const IconData. This flag writes TREE_SHAKE_ICONS=false into
      # Generated.xcconfig, which the xcodebuild Run Script honours.
      - name: Configure iOS project (Flutter)
        run: flutter build ios --config-only --release --no-codesign --no-tree-shake-icons

      - name: Build unsigned iOS app
        run: |
          set -eo pipefail
          LOG="$RUNNER_TEMP/xcodebuild.log"
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build 2>&1 | tee "$LOG"
          if ! grep -q "BUILD SUCCEEDED" "$LOG"; then
            echo "=== errors ==="
            grep -E "error:|The following build commands failed|Module .* not found" "$LOG" | head -40 || true
            echo "=== last 30 lines ==="
            tail -30 "$LOG"
            exit 1
          fi

      - name: Package unsigned IPA
        run: |
          set -eo pipefail
          APP=$(find "$RUNNER_TEMP/DerivedData" -name "Runner.app" -path "*/Release-iphoneos/*" | head -1)
          echo "Packaging: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "monolith.ipa" Payload
          rm -rf Payload

      - name: Upload IPA as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Monolith-iOS-unsigned
          path: monolith.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: monolith.ipa
          fail_on_unmatched_files: true
          append_body: true
          body: |
            ## iOS — `monolith.ipa` (unsigned)

            - **App:** Monolith
            - **Version:** ${{ github.ref_name }}
            - **Bundle ID:** `dev.naveed-gung.monolith`
            - **Developer:** naveed-gung

            This IPA is **not App Store signed**. Install via AltStore, Sideloadly, or
            any sideloading tool of your choice.

            > **Note:** You will need to re-sign it with your own Apple ID Developer
            > certificate before it can run on a physical device.

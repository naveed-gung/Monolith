# JVM — 4 GB heap gives the Kotlin compiler room without paging
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Daemon — keep alive between invocations so Gradle doesn't cold-start each build
org.gradle.daemon=true

# Parallelism — compile sub-projects in parallel (significant speedup on multi-core)
org.gradle.parallel=true
org.gradle.workers.max=4

# Configuration cache — re-use task graph between builds when inputs don't change
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# Build cache — reuse outputs from prior builds and CI
org.gradle.caching=true

# AndroidX — mandatory; all support libraries have been migrated
android.useAndroidX=true

# R class — each module gets only its own R symbols (faster compilation, smaller DEX)
android.nonTransitiveRClass=true

# Jetifier — disable; all dependencies are native AndroidX
android.enableJetifier=false

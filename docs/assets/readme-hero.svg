<svg width="1440" height="840" viewBox="0 0 1440 840" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">Monolith README hero</title>
  <desc id="desc">Monolith brand hero: offline-first Flutter music player for Android and iOS with system-grade playback surfaces and a yt-dlp-oriented download model.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1440" y2="840" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0A0C"/>
      <stop offset="1" stop-color="#121214"/>
    </linearGradient>
    <linearGradient id="accent" x1="170" y1="120" x2="298" y2="248" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF4D5E"/>
      <stop offset="1" stop-color="#C23A48"/>
    </linearGradient>
    <filter id="soft" x="40" y="44" width="1360" height="752" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1440" height="840" rx="36" fill="url(#bg)"/>
  <circle cx="1240" cy="150" r="180" fill="#FF4D5E" fill-opacity="0.07"/>
  <circle cx="180" cy="710" r="190" fill="#FF4D5E" fill-opacity="0.05"/>

  <g filter="url(#soft)">
    <rect x="60" y="60" width="1320" height="720" rx="32" fill="#121214"/>
    <rect x="61" y="61" width="1318" height="718" rx="31" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2"/>
  </g>

  <!-- Brand block -->
  <rect x="110" y="120" width="128" height="128" rx="30" fill="url(#accent)"/>
  <text x="174" y="222" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="700">m</text>

  <text x="272" y="172" fill="#F5F5F7" font-size="62" font-weight="800" letter-spacing="-1">Monolith</text>
  <text x="274" y="214" fill="#FF4D5E" font-size="24" font-weight="600">Offline-first music player · Flutter · Android &amp; iOS</text>
  <text x="274" y="250" fill="#A2A2AC" font-size="21">System-grade playback surfaces and on-device ownership</text>

  <!-- Feature pillars -->
  <g>
    <rect x="110" y="316" width="560" height="116" rx="22" fill="#1B1B1F" stroke="#2C2C33" stroke-width="1.5"/>
    <rect x="134" y="340" width="52" height="52" rx="14" fill="#FF4D5E" fill-opacity="0.16"/>
    <path d="M150 356v34l28 -17z" fill="#FF4D5E"/>
    <text x="206" y="364" fill="#F5F5F7" font-size="22" font-weight="700">Library &amp; playlists</text>
    <text x="206" y="394" fill="#A2A2AC" font-size="17">Import device audio, organise offline listening.</text>

    <rect x="110" y="452" width="560" height="116" rx="22" fill="#1B1B1F" stroke="#2C2C33" stroke-width="1.5"/>
    <rect x="134" y="476" width="52" height="52" rx="14" fill="#FF4D5E" fill-opacity="0.16"/>
    <path d="M160 472v30m0 0l-9 -9m9 9l9 -9M150 506h20" stroke="#FF4D5E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="206" y="500" fill="#F5F5F7" font-size="22" font-weight="700">Download model</text>
    <text x="206" y="530" fill="#A2A2AC" font-size="17">yt-dlp-oriented acquisition · youtube_explode_dart.</text>

    <rect x="110" y="588" width="560" height="116" rx="22" fill="#1B1B1F" stroke="#2C2C33" stroke-width="1.5"/>
    <rect x="134" y="612" width="52" height="52" rx="14" fill="#FF4D5E" fill-opacity="0.16"/>
    <rect x="151" y="624" width="18" height="28" rx="4" stroke="#FF4D5E" stroke-width="3" fill="none"/>
    <text x="206" y="636" fill="#F5F5F7" font-size="22" font-weight="700">System surfaces</text>
    <text x="206" y="666" fill="#A2A2AC" font-size="17">Lock screen, Control Center, Android media deck.</text>
  </g>

  <!-- Now playing mock -->
  <rect x="730" y="316" width="560" height="388" rx="28" fill="#16161A" stroke="#2C2C33" stroke-width="1.5"/>
  <text x="766" y="368" fill="#6C6C76" font-size="15" font-weight="700" letter-spacing="1.5">NOW PLAYING</text>

  <rect x="766" y="392" width="96" height="96" rx="20" fill="url(#accent)"/>
  <text x="814" y="456" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700">m</text>
  <text x="886" y="424" fill="#F5F5F7" font-size="26" font-weight="700">Your track, your file</text>
  <text x="886" y="456" fill="#A2A2AC" font-size="17">Metadata for player, lock screen</text>
  <text x="886" y="478" fill="#A2A2AC" font-size="17">and the system media deck.</text>

  <rect x="766" y="520" width="524" height="8" rx="4" fill="#26262C"/>
  <rect x="766" y="520" width="224" height="8" rx="4" fill="#FF4D5E"/>
  <text x="766" y="552" fill="#6C6C76" font-size="14">1:24</text>
  <text x="1290" y="552" text-anchor="end" fill="#6C6C76" font-size="14">3:18</text>

  <circle cx="906" cy="624" r="22" fill="#26262C"/>
  <path d="M912 614l-14 10l14 10z" fill="#F5F5F7"/>
  <circle cx="1010" cy="624" r="34" fill="#FF4D5E"/>
  <path d="M1000 606l24 18l-24 18z" fill="#FFFFFF"/>
  <circle cx="1114" cy="624" r="22" fill="#26262C"/>
  <path d="M1108 614l14 10l-14 10z" fill="#F5F5F7"/>

</svg>

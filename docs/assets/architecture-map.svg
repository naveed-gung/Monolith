<svg width="1280" height="900" viewBox="0 0 1280 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="120" y1="40" x2="1160" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08161E"/>
      <stop offset="1" stop-color="#102B36"/>
    </linearGradient>
    <linearGradient id="app" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1BB29B"/>
      <stop offset="1" stop-color="#11728A"/>
    </linearGradient>
    <linearGradient id="state" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1D5E75"/>
      <stop offset="1" stop-color="#0F3143"/>
    </linearGradient>
    <linearGradient id="svc" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#18242B"/>
      <stop offset="1" stop-color="#0C161C"/>
    </linearGradient>
    <linearGradient id="feat" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#B96A2E"/>
      <stop offset="1" stop-color="#8D4C1F"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="900" rx="36" fill="url(#bg)"/>
  <text x="88" y="94" fill="#F4F7F8" font-size="42" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Monolith Architecture Map</text>
  <text x="88" y="132" fill="#94B2B8" font-size="18" font-family="Segoe UI, Arial, sans-serif">Controller-first orchestration with feature-scoped UI and shared platform integration.</text>

  <rect x="88" y="180" width="1104" height="110" rx="28" fill="url(#app)"/>
  <text x="124" y="236" fill="#F7FBFC" font-size="30" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Application Layer</text>
  <text x="124" y="272" fill="#DCF4EF" font-size="18" font-family="Segoe UI, Arial, sans-serif">main.dart initializes background playback, MonolithApp scopes the controller, and the shell renders the shared mobile experience.</text>
  <rect x="914" y="206" width="242" height="54" rx="18" fill="#F7FBFC" fill-opacity="0.14"/>
  <text x="958" y="240" fill="#F7FBFC" font-size="18" font-family="Segoe UI, Arial, sans-serif">MaterialApp + Theme</text>

  <rect x="88" y="332" width="540" height="212" rx="28" fill="url(#state)" stroke="#5A96A6" stroke-opacity="0.4"/>
  <text x="124" y="390" fill="#F7FBFC" font-size="30" font-family="Segoe UI, Arial, sans-serif" font-weight="700">State Core</text>
  <text x="124" y="426" fill="#C8DCE4" font-size="18" font-family="Segoe UI, Arial, sans-serif">MonolithController manages queue selection, playback, downloads, playlists, theme, and app navigation.</text>
  <rect x="124" y="462" width="138" height="36" rx="18" fill="#F7FBFC" fill-opacity="0.12"/>
  <text x="153" y="486" fill="#F7FBFC" font-size="15" font-family="Segoe UI, Arial, sans-serif">Playback</text>
  <rect x="274" y="462" width="150" height="36" rx="18" fill="#F7FBFC" fill-opacity="0.12"/>
  <text x="307" y="486" fill="#F7FBFC" font-size="15" font-family="Segoe UI, Arial, sans-serif">Downloads</text>
  <rect x="436" y="462" width="146" height="36" rx="18" fill="#F7FBFC" fill-opacity="0.12"/>
  <text x="474" y="486" fill="#F7FBFC" font-size="15" font-family="Segoe UI, Arial, sans-serif">Playlists</text>
  <rect x="124" y="510" width="128" height="36" rx="18" fill="#F7FBFC" fill-opacity="0.12"/>
  <text x="159" y="534" fill="#F7FBFC" font-size="15" font-family="Segoe UI, Arial, sans-serif">Library</text>
  <rect x="264" y="510" width="116" height="36" rx="18" fill="#F7FBFC" fill-opacity="0.12"/>
  <text x="298" y="534" fill="#F7FBFC" font-size="15" font-family="Segoe UI, Arial, sans-serif">Theme</text>
  <rect x="392" y="510" width="152" height="36" rx="18" fill="#F7FBFC" fill-opacity="0.12"/>
  <text x="425" y="534" fill="#F7FBFC" font-size="15" font-family="Segoe UI, Arial, sans-serif">Navigation</text>

  <rect x="652" y="332" width="540" height="212" rx="28" fill="url(#svc)" stroke="#58737E" stroke-opacity="0.4"/>
  <text x="688" y="390" fill="#F7FBFC" font-size="30" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Core Services</text>
  <text x="688" y="426" fill="#B4C7CD" font-size="18" font-family="Segoe UI, Arial, sans-serif">Shared services isolate storage, device media access, import flow, and downloader integration from the widgets.</text>
  <rect x="688" y="462" width="186" height="36" rx="18" fill="#F7FBFC" fill-opacity="0.1"/>
  <text x="719" y="486" fill="#F7FBFC" font-size="15" font-family="Segoe UI, Arial, sans-serif">LocalMediaService</text>
  <rect x="886" y="462" width="162" height="36" rx="18" fill="#F7FBFC" fill-opacity="0.1"/>
  <text x="925" y="486" fill="#F7FBFC" font-size="15" font-family="Segoe UI, Arial, sans-serif">DownloadStore</text>
  <rect x="1060" y="462" width="96" height="36" rx="18" fill="#F7FBFC" fill-opacity="0.1"/>
  <text x="1088" y="486" fill="#F7FBFC" font-size="15" font-family="Segoe UI, Arial, sans-serif">Models</text>
  <rect x="688" y="510" width="212" height="36" rx="18" fill="#F7FBFC" fill-opacity="0.1"/>
  <text x="726" y="534" fill="#F7FBFC" font-size="15" font-family="Segoe UI, Arial, sans-serif">ManualAudioImportService</text>
  <rect x="912" y="510" width="208" height="36" rx="18" fill="#F7FBFC" fill-opacity="0.1"/>
  <text x="953" y="534" fill="#F7FBFC" font-size="15" font-family="Segoe UI, Arial, sans-serif">MediaDownloader</text>

  <rect x="88" y="598" width="1104" height="198" rx="28" fill="url(#feat)"/>
  <text x="124" y="656" fill="#FFF5EB" font-size="30" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Feature Presentation</text>
  <text x="124" y="692" fill="#F5DDC9" font-size="18" font-family="Segoe UI, Arial, sans-serif">Feature widgets stay mostly declarative: they read controller state, dispatch actions, and render the Library, Downloads, Player, Search, Settings, and Shell surfaces.</text>
  <rect x="124" y="724" width="128" height="38" rx="19" fill="#FFF5EB" fill-opacity="0.14"/>
  <text x="162" y="749" fill="#FFF5EB" font-size="15" font-family="Segoe UI, Arial, sans-serif">Shell</text>
  <rect x="266" y="724" width="138" height="38" rx="19" fill="#FFF5EB" fill-opacity="0.14"/>
  <text x="299" y="749" fill="#FFF5EB" font-size="15" font-family="Segoe UI, Arial, sans-serif">Library</text>
  <rect x="418" y="724" width="152" height="38" rx="19" fill="#FFF5EB" fill-opacity="0.14"/>
  <text x="452" y="749" fill="#FFF5EB" font-size="15" font-family="Segoe UI, Arial, sans-serif">Downloads</text>
  <rect x="584" y="724" width="132" height="38" rx="19" fill="#FFF5EB" fill-opacity="0.14"/>
  <text x="620" y="749" fill="#FFF5EB" font-size="15" font-family="Segoe UI, Arial, sans-serif">Player</text>
  <rect x="730" y="724" width="126" height="38" rx="19" fill="#FFF5EB" fill-opacity="0.14"/>
  <text x="767" y="749" fill="#FFF5EB" font-size="15" font-family="Segoe UI, Arial, sans-serif">Search</text>
  <rect x="870" y="724" width="136" height="38" rx="19" fill="#FFF5EB" fill-opacity="0.14"/>
  <text x="902" y="749" fill="#FFF5EB" font-size="15" font-family="Segoe UI, Arial, sans-serif">Settings</text>

  <path d="M358 290V332" stroke="#50D4C2" stroke-width="4" stroke-linecap="round"/>
  <path d="M922 290V332" stroke="#6FB6C9" stroke-width="4" stroke-linecap="round"/>
  <path d="M358 544V598" stroke="#E6A56E" stroke-width="4" stroke-linecap="round"/>
  <path d="M922 544V598" stroke="#E6A56E" stroke-width="4" stroke-linecap="round"/>
  <path d="M348 318L358 334L368 318" fill="none" stroke="#50D4C2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M912 318L922 334L932 318" fill="none" stroke="#6FB6C9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M348 582L358 598L368 582" fill="none" stroke="#E6A56E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M912 582L922 598L932 582" fill="none" stroke="#E6A56E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
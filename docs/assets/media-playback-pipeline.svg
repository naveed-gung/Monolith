<svg width="1280" height="760" viewBox="0 0 1280 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">Media playback pipeline</title>
  <desc id="desc">From track activation through the playback session to Android and iOS system playback surfaces.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0A0C"/>
      <stop offset="1" stop-color="#121214"/>
    </linearGradient>
    <filter id="shadow" x="40" y="170" width="1200" height="430" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="760" rx="36" fill="url(#bg)"/>
  <circle cx="1120" cy="110" r="150" fill="#FF4D5E" fill-opacity="0.06"/>
  <circle cx="150" cy="650" r="170" fill="#FF4D5E" fill-opacity="0.05"/>

  <text x="86" y="98" fill="#F5F5F7" font-size="38" font-weight="800" letter-spacing="-0.5">Media playback pipeline</text>
  <text x="86" y="134" fill="#A2A2AC" font-size="18">From track selection to Android and iOS system playback surfaces.</text>

  <g filter="url(#shadow)">
    <rect x="86" y="196" width="336" height="372" rx="28" fill="#1B1B1F" stroke="#2C2C33" stroke-width="1.5"/>
    <rect x="472" y="196" width="336" height="372" rx="28" fill="#1B1B1F" stroke="#2C2C33" stroke-width="1.5"/>
    <rect x="858" y="196" width="336" height="372" rx="28" fill="#16161A" stroke="#2C2C33" stroke-width="1.5"/>
  </g>

  <!-- Stage A -->
  <rect x="118" y="232" width="56" height="56" rx="15" fill="#FF4D5E" fill-opacity="0.16"/>
  <ellipse cx="142" cy="272" rx="7" ry="5.5" fill="#FF4D5E"/>
  <path d="M148.5 272V244q8 2 9 12" stroke="#FF4D5E" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="118" y="328" fill="#F5F5F7" font-size="24" font-weight="700">Track activation</text>
  <text x="118" y="364" fill="#A2A2AC" font-size="16">Controller selects a track,</text>
  <text x="118" y="386" fill="#A2A2AC" font-size="16">resolves artwork, and loads</text>
  <text x="118" y="408" fill="#A2A2AC" font-size="16">a tagged local source.</text>
  <rect x="118" y="436" width="272" height="40" rx="12" fill="#0A0A0C" stroke="#2C2C33"/>
  <text x="136" y="461" fill="#FF8A95" font-size="13" font-family="'SF Mono', Consolas, 'Roboto Mono', monospace">AudioSource.uri(file)</text>
  <rect x="118" y="488" width="272" height="40" rx="12" fill="#0A0A0C" stroke="#2C2C33"/>
  <text x="136" y="513" fill="#FF8A95" font-size="13" font-family="'SF Mono', Consolas, 'Roboto Mono', monospace">Tagged MediaItem</text>

  <!-- Stage B -->
  <rect x="504" y="232" width="56" height="56" rx="15" fill="#FF4D5E" fill-opacity="0.16"/>
  <rect x="520" y="252" width="6" height="20" rx="3" fill="#FF4D5E"/>
  <rect x="530" y="246" width="6" height="32" rx="3" fill="#FF4D5E"/>
  <rect x="540" y="256" width="6" height="14" rx="3" fill="#FF4D5E"/>
  <text x="504" y="328" fill="#F5F5F7" font-size="24" font-weight="700">Playback session</text>
  <text x="504" y="364" fill="#A2A2AC" font-size="16">just_audio renders the file;</text>
  <text x="504" y="386" fill="#A2A2AC" font-size="16">background publishes metadata;</text>
  <text x="504" y="408" fill="#A2A2AC" font-size="16">audio_session pins music mode.</text>
  <rect x="504" y="436" width="272" height="40" rx="12" fill="#0A0A0C" stroke="#2C2C33"/>
  <text x="522" y="461" fill="#FF8A95" font-size="13" font-family="'SF Mono', Consolas, 'Roboto Mono', monospace">AudioPlayer</text>
  <rect x="504" y="488" width="272" height="40" rx="12" fill="#0A0A0C" stroke="#2C2C33"/>
  <text x="522" y="513" fill="#FF8A95" font-size="13" font-family="'SF Mono', Consolas, 'Roboto Mono', monospace">JustAudioBackground</text>

  <!-- Stage C -->
  <rect x="890" y="232" width="56" height="56" rx="15" fill="#FF4D5E" fill-opacity="0.16"/>
  <rect x="906" y="240" width="24" height="40" rx="5" stroke="#FF4D5E" stroke-width="3" fill="none"/>
  <circle cx="918" cy="272" r="2.5" fill="#FF4D5E"/>
  <text x="890" y="328" fill="#F5F5F7" font-size="24" font-weight="700">System surfaces</text>
  <text x="890" y="364" fill="#A2A2AC" font-size="16">Android exposes a notification</text>
  <text x="890" y="386" fill="#A2A2AC" font-size="16">deck; iOS publishes to Lock</text>
  <text x="890" y="408" fill="#A2A2AC" font-size="16">Screen and Control Center.</text>
  <rect x="890" y="436" width="150" height="40" rx="12" fill="#FFFFFF" fill-opacity="0.06"/>
  <text x="908" y="461" fill="#F5F5F7" font-size="14">Android deck</text>
  <rect x="890" y="488" width="150" height="40" rx="12" fill="#FFFFFF" fill-opacity="0.06"/>
  <text x="908" y="513" fill="#F5F5F7" font-size="14">Lock screen</text>

  <!-- connectors -->
  <path d="M422 382h44" stroke="#FF4D5E" stroke-width="4" stroke-linecap="round"/>
  <path d="M452 372l14 10l-14 10" stroke="#FF4D5E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M808 382h44" stroke="#FF4D5E" stroke-width="4" stroke-linecap="round"/>
  <path d="M838 372l14 10l-14 10" stroke="#FF4D5E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- footer -->
  <rect x="86" y="614" width="1108" height="104" rx="22" fill="#16161A" stroke="#2C2C33" stroke-width="1.5"/>
  <rect x="86" y="614" width="6" height="104" rx="3" fill="#FF4D5E"/>
  <text x="122" y="650" fill="#6C6C76" font-size="13" font-weight="700" letter-spacing="1.5">PLATFORM NOTE</text>
  <text x="122" y="678" fill="#F5F5F7" font-size="17">iOS does not expose an Android-style notification-shade media card.</text>
  <text x="122" y="702" fill="#A2A2AC" font-size="17">The equivalent surfaces are the Lock Screen and Control Center.</text>
</svg>

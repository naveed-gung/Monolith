name: Android Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.4) — leave blank to use current commit'
        required: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: true
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2560m -Dorg.gradle.parallel=false -Dorg.gradle.workers.max=2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Ensure debug keystore exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      # NOTE ON SIGNING: this release APK is signed with the debug keystore
      # (android/app/build.gradle.kts -> release { signingConfig = signingConfigs.getByName("debug") }).
      # Deliberate choice for sideloaded builds.
      - name: Build release APK
        run: |
          if ! flutter build apk --release --no-tree-shake-icons 2>&1 | tee build.log; then
            echo "## Android Build Failure" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Rename APK
        run: |
          APK=$(find build/app/outputs -name "*.apk" -type f | head -n 1)
          if [ -z "$APK" ]; then
            echo "No APK found in build/app/outputs"
            find build -name "*.apk" || true
            exit 1
          fi
          echo "Found APK: $APK"
          cp "$APK" monolith.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Monolith-Android
          path: monolith.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Extract app version
        id: app_version
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d '[:space:]')
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.app_version.outputs.tag }}
          name: "Monolith ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.app_version.outputs.tag }}"
          files: monolith.apk
          fail_on_unmatched_files: true
          append_body: true
          body: |
            ## Android — `monolith.apk`

            - **App:** Monolith
            - **Version:** ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.app_version.outputs.tag }}
            - **Min Android:** 7.0 (API 24)
            - **Bundle ID:** `dev.naveed_gung.monolith`

            Install on any Android 7.0+ device: download `monolith.apk`, then
            enable **Install unknown apps** for your browser/file manager when
            prompted. No Play Store account needed.

            > **Note:** this build is signed with a debug key (fine for
            > sideloading). Android may warn it's from an unknown developer —
            > that's expected for a non–Play Store APK.

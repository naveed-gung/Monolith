name: iOS Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.2) — leave blank to use current commit'
        required: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # needed to create/update GitHub Releases

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 40

    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods/repos
            ~/Library/Caches/CocoaPods
            ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock', 'pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Install dependencies
        run: flutter pub get

      - name: Precache iOS artifacts
        run: flutter precache --ios

      # phosphor_flutter 2.1.0 uses 'extends IconData' which became illegal in
      # Flutter 3.44 (IconData is now a final class). No compatible release exists.
      # Three-part patch applied to the pub-cache in-place:
      #   1. phosphor_icon_data.dart  — replace class hierarchy with extension types
      #   2. phosphor_icon.dart       — remove duotone 'is' check (ext-type erasure
      #                                  would make it always-true at runtime)
      #   3. All generated icon files — change 'static const' to 'static final'
      #                                  because non-const ext-type constructors
      #                                  can't be used in const declarations
      - name: Patch phosphor_flutter for Flutter 3.44 final-class change
        run: |
          set -euo pipefail
          PKG="$HOME/.pub-cache/hosted/pub.dev/phosphor_flutter-2.1.0/lib/src"
          if [ ! -d "$PKG" ]; then
            echo "ERROR: phosphor_flutter not found at $PKG"
            ls "$HOME/.pub-cache/hosted/pub.dev/" | grep phosphor || echo "(no phosphor entries)"
            exit 1
          fi
          cp .github/patches/phosphor_icon_data_flutter344.dart "$PKG/phosphor_icon_data.dart"
          cp .github/patches/phosphor_icon_flutter344.dart      "$PKG/phosphor_icon.dart"
          for style in regular thin light bold fill duotone; do
            sed -i '' 's/static const /static final /g' "$PKG/phosphor_icons_${style}.dart"
          done
          echo "=== Patch verification ==="
          head -3 "$PKG/phosphor_icon_data.dart"
          echo "static final count in icons_regular: $(grep -c 'static final' "$PKG/phosphor_icons_regular.dart")"
          echo "static const remaining in icons_regular: $(grep -c 'static const' "$PKG/phosphor_icons_regular.dart" || echo 0)"

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: Build unsigned iOS app (no code signing required)
        run: |
          set -eo pipefail
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            VERBOSE_SCRIPT_LOGGING=YES \
            build 2>&1 | tee xcodebuild.log
          echo "=== FIRST 50 error/warning lines ==="
          grep -E "error:|warning:|flutter|Failed" xcodebuild.log | head -50 || true
          echo "=== LAST 30 lines of build log ==="
          tail -30 xcodebuild.log
          grep -q "BUILD SUCCEEDED" xcodebuild.log

      - name: Package unsigned IPA
        run: |
          set -eo pipefail
          APP=$(find "$RUNNER_TEMP/DerivedData" -name "Runner.app" -path "*/Release-iphoneos/*" | head -1)
          echo "Packaging: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "Monolith-${{ github.ref_name }}-unsigned.ipa" Payload
          rm -rf Payload

      - name: Upload IPA as workflow artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: Monolith-iOS-unsigned
          path: Monolith-*-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      # Only publish to GitHub Releases when triggered by a version tag
      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Monolith-*-unsigned.ipa
          fail_on_unmatched_files: true
          body: |
            ## iOS (unsigned IPA)

            This IPA is **not App Store signed**. Install via AltStore, Sideloadly, or
            any sideloading tool of your choice.

            > **Note:** You will need to re-sign it with your own Apple ID Developer
            > certificate before it can run on a physical device.

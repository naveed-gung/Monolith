<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">Development validation loop</title>
  <desc id="desc">Three-step development loop — sync, verify, package — with platform notes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0A0C"/>
      <stop offset="1" stop-color="#121214"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" rx="36" fill="url(#bg)"/>
  <circle cx="1100" cy="110" r="160" fill="#FF4D5E" fill-opacity="0.06"/>

  <text x="86" y="96" fill="#F5F5F7" font-size="38" font-weight="800" letter-spacing="-0.5">Development validation loop</text>
  <text x="86" y="132" fill="#A2A2AC" font-size="18">Fast feedback first, broader platform validation second.</text>

  <!-- Step 1 -->
  <rect x="86" y="196" width="336" height="244" rx="26" fill="#1B1B1F" stroke="#2C2C33" stroke-width="1.5"/>
  <circle cx="128" cy="244" r="22" fill="#FF4D5E"/>
  <text x="128" y="252" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800">1</text>
  <text x="168" y="252" fill="#F5F5F7" font-size="26" font-weight="700">Sync</text>
  <text x="118" y="306" fill="#A2A2AC" font-size="17">Update dependencies and</text>
  <text x="118" y="330" fill="#A2A2AC" font-size="17">align plugin overrides.</text>
  <rect x="118" y="368" width="272" height="44" rx="12" fill="#0A0A0C" stroke="#2C2C33"/>
  <text x="138" y="396" fill="#FF8A95" font-size="16" font-family="'SF Mono', Consolas, 'Roboto Mono', monospace">flutter pub get</text>

  <!-- Step 2 -->
  <rect x="472" y="196" width="336" height="244" rx="26" fill="#1B1B1F" stroke="#2C2C33" stroke-width="1.5"/>
  <circle cx="514" cy="244" r="22" fill="#FF4D5E"/>
  <text x="514" y="252" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800">2</text>
  <text x="554" y="252" fill="#F5F5F7" font-size="26" font-weight="700">Verify</text>
  <text x="504" y="306" fill="#A2A2AC" font-size="17">Run the widget test suite</text>
  <text x="504" y="330" fill="#A2A2AC" font-size="17">as a regression checkpoint.</text>
  <rect x="504" y="368" width="272" height="44" rx="12" fill="#0A0A0C" stroke="#2C2C33"/>
  <text x="524" y="396" fill="#FF8A95" font-size="14" font-family="'SF Mono', Consolas, 'Roboto Mono', monospace">flutter test</text>

  <!-- Step 3 -->
  <rect x="858" y="196" width="336" height="244" rx="26" fill="#1B1B1F" stroke="#2C2C33" stroke-width="1.5"/>
  <circle cx="900" cy="244" r="22" fill="#FF4D5E"/>
  <text x="900" y="252" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800">3</text>
  <text x="940" y="252" fill="#F5F5F7" font-size="26" font-weight="700">Package</text>
  <text x="890" y="306" fill="#A2A2AC" font-size="17">Build when manifests or</text>
  <text x="890" y="330" fill="#A2A2AC" font-size="17">packaging changed.</text>
  <rect x="890" y="368" width="272" height="44" rx="12" fill="#0A0A0C" stroke="#2C2C33"/>
  <text x="910" y="396" fill="#FF8A95" font-size="16" font-family="'SF Mono', Consolas, 'Roboto Mono', monospace">flutter build apk</text>

  <!-- connectors -->
  <path d="M422 318h44" stroke="#FF4D5E" stroke-width="4" stroke-linecap="round"/>
  <path d="M452 308l14 10l-14 10" stroke="#FF4D5E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M808 318h44" stroke="#FF4D5E" stroke-width="4" stroke-linecap="round"/>
  <path d="M838 308l14 10l-14 10" stroke="#FF4D5E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- footer -->
  <rect x="86" y="488" width="1108" height="104" rx="22" fill="#16161A" stroke="#2C2C33" stroke-width="1.5"/>
  <rect x="86" y="488" width="6" height="104" rx="3" fill="#FF4D5E"/>
  <text x="122" y="528" fill="#F5F5F7" font-size="17">Windows can validate shared Flutter logic and Android packaging.</text>
  <text x="122" y="556" fill="#A2A2AC" font-size="17">iOS playback changes need a final run on macOS or a real device.</text>
</svg>

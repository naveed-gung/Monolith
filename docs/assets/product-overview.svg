  <text x="132" y="286" fill="#F7FBFC" font-size="28" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Library</text>
  <text x="132" y="326" fill="#D7F1EE" font-size="18" font-family="Segoe UI, Arial, sans-serif">Import device audio, browse playlists,</text>
  <text x="132" y="352" fill="#D7F1EE" font-size="18" font-family="Segoe UI, Arial, sans-serif">and keep local listening organized.</text>
  <rect x="132" y="388" width="108" height="32" rx="16" fill="#F8FFFE" fill-opacity="0.16"/>

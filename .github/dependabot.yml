# See docs/ci.md for what the scheduled Dependabot runs are and the PR triage
# policy. Monthly + grouped to cut noise; security updates still arrive ASAP.
version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      pub-minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"

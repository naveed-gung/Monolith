  <text x="512" y="286" fill="#F7FBFC" font-size="28" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Downloads</text>
  <text x="512" y="326" fill="#B4C6D4" font-size="18" font-family="Segoe UI, Arial, sans-serif">Manage offline files, downloader state,</text>
  <text x="512" y="352" fill="#B4C6D4" font-size="18" font-family="Segoe UI, Arial, sans-serif">and filtered local storage views.</text>
  <rect x="512" y="388" width="92" height="32" rx="16" fill="#F8FFFE" fill-opacity="0.12"/>

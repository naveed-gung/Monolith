  <text x="136" y="574" fill="#F7FBFC" font-size="20" font-family="Segoe UI, Arial, sans-serif" font-weight="600">Shared Flutter Shell</text>
  <text x="136" y="602" fill="#9AB7BD" font-size="16" font-family="Segoe UI, Arial, sans-serif">One controller orchestrates imports, downloads, playlists, playback state, and theme while Android and iOS expose their native media surfaces.</text>

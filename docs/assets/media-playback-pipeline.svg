<svg width="1280" height="760" viewBox="0 0 1280 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="100" y1="40" x2="1180" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#091820"/>
      <stop offset="1" stop-color="#12313C"/>
    </linearGradient>
    <linearGradient id="lane1" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1BB39A"/>
      <stop offset="1" stop-color="#147989"/>
    </linearGradient>
    <linearGradient id="lane2" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#17405A"/>
      <stop offset="1" stop-color="#10293A"/>
    </linearGradient>
    <linearGradient id="lane3" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#C17B3D"/>
      <stop offset="1" stop-color="#915423"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="760" rx="36" fill="url(#bg)"/>
  <text x="86" y="98" fill="#F4F7F8" font-size="40" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Media Playback Pipeline</text>
  <text x="86" y="136" fill="#93B1B7" font-size="18" font-family="Segoe UI, Arial, sans-serif">From local file selection to lock-screen and Control Center metadata.</text>

  <rect x="86" y="206" width="300" height="360" rx="30" fill="url(#lane1)"/>
  <text x="120" y="270" fill="#F8FCFC" font-size="28" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Track Activation</text>
  <text x="120" y="314" fill="#DDF6F1" font-size="18" font-family="Segoe UI, Arial, sans-serif">The controller selects a playable track,</text>
  <text x="120" y="342" fill="#DDF6F1" font-size="18" font-family="Segoe UI, Arial, sans-serif">resolves artwork, and loads a file URI.</text>
  <rect x="120" y="386" width="224" height="40" rx="20" fill="#F8FCFC" fill-opacity="0.16"/>
  <text x="148" y="412" fill="#F8FCFC" font-size="16" font-family="Consolas, monospace">AudioSource.uri(Uri.file(...))</text>
  <rect x="120" y="442" width="188" height="40" rx="20" fill="#F8FCFC" fill-opacity="0.16"/>
  <text x="154" y="468" fill="#F8FCFC" font-size="16" font-family="Consolas, monospace">tag: MediaItem(...)</text>

  <rect x="490" y="206" width="300" height="360" rx="30" fill="url(#lane2)" stroke="#5A839B" stroke-opacity="0.45"/>
  <text x="524" y="270" fill="#F8FCFC" font-size="28" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Playback Session</text>
  <text x="524" y="314" fill="#C6D6E0" font-size="18" font-family="Segoe UI, Arial, sans-serif">just_audio plays the file while</text>
  <text x="524" y="342" fill="#C6D6E0" font-size="18" font-family="Segoe UI, Arial, sans-serif">just_audio_background publishes metadata.</text>
  <rect x="524" y="386" width="176" height="40" rx="20" fill="#F8FCFC" fill-opacity="0.12"/>
  <text x="554" y="412" fill="#F8FCFC" font-size="16" font-family="Consolas, monospace">AudioPlayer</text>
  <rect x="524" y="442" width="212" height="40" rx="20" fill="#F8FCFC" fill-opacity="0.12"/>
  <text x="555" y="468" fill="#F8FCFC" font-size="16" font-family="Consolas, monospace">JustAudioBackground.init</text>
  <rect x="524" y="498" width="200" height="40" rx="20" fill="#F8FCFC" fill-opacity="0.12"/>
  <text x="558" y="524" fill="#F8FCFC" font-size="16" font-family="Consolas, monospace">AudioSession.music()</text>

  <rect x="894" y="206" width="300" height="360" rx="30" fill="url(#lane3)"/>
  <text x="928" y="270" fill="#FFF6EC" font-size="28" font-family="Segoe UI, Arial, sans-serif" font-weight="700">System Surfaces</text>
  <text x="928" y="314" fill="#F5DDC9" font-size="18" font-family="Segoe UI, Arial, sans-serif">Android exposes the media deck while iOS</text>
  <text x="928" y="342" fill="#F5DDC9" font-size="18" font-family="Segoe UI, Arial, sans-serif">surfaces playback on the lock screen and</text>
  <text x="928" y="370" fill="#F5DDC9" font-size="18" font-family="Segoe UI, Arial, sans-serif">inside Control Center.</text>
  <rect x="928" y="418" width="152" height="40" rx="20" fill="#FFF6EC" fill-opacity="0.14"/>
  <text x="956" y="444" fill="#FFF6EC" font-size="16" font-family="Segoe UI, Arial, sans-serif">Android deck</text>
  <rect x="928" y="474" width="144" height="40" rx="20" fill="#FFF6EC" fill-opacity="0.14"/>
  <text x="964" y="500" fill="#FFF6EC" font-size="16" font-family="Segoe UI, Arial, sans-serif">Lock screen</text>
  <rect x="1088" y="474" width="82" height="40" rx="20" fill="#FFF6EC" fill-opacity="0.14"/>
  <text x="1102" y="500" fill="#FFF6EC" font-size="16" font-family="Segoe UI, Arial, sans-serif">iOS</text>

  <path d="M386 388H474" stroke="#57D8C6" stroke-width="5" stroke-linecap="round"/>
  <path d="M790 388H878" stroke="#E4A16D" stroke-width="5" stroke-linecap="round"/>
  <path d="M458 376L478 388L458 400" fill="none" stroke="#57D8C6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M862 376L882 388L862 400" fill="none" stroke="#E4A16D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="146" y="618" width="988" height="78" rx="22" fill="#102A34" stroke="#2D6872" stroke-opacity="0.45"/>
  <text x="184" y="665" fill="#F4F7F8" font-size="20" font-family="Segoe UI, Arial, sans-serif">Important iOS note: there is no Android-style notification shade media card. The equivalent user-facing targets are Lock Screen and Control Center.</text>
</svg>
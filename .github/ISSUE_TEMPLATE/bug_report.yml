name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device & OS
      placeholder: e.g. iPhone 13, iOS 16.7
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce

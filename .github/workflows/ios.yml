name: iOS Build & Release

# Runs on pushes to main, version tags (v*), and manual dispatch.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.2) — leave blank to use current commit'
        required: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 15

    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods/repos
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pods-


      - name: Install dependencies
        run: flutter pub get


      # Hybrid build: let Flutter do the CONFIGURATION only (pub get, Swift
      # Package Manager integration, and the correct `pod install` that exposes
      # every plugin pod module — this is what fixes "Module 'audio_service'
      # not found"), then drive `xcodebuild` directly so signing is genuinely
      # disabled. Plain `flutter build ios --no-codesign` compiles fine here
      # but still aborts at Flutter's own "requires a Development Team" gate;
      # raw xcodebuild on the Flutter-configured workspace skips that gate.
      # --no-tree-shake-icons is REQUIRED: the phosphor_flutter patch turns the
      # icon constructors from `static const` into `static final` (extension-type
      # constructors can't be const), and Flutter's icon tree-shaker rejects
      # non-const IconData. This flag writes TREE_SHAKE_ICONS=false into
      # Generated.xcconfig, which the xcodebuild Run Script honours.
      - name: Configure iOS project (Flutter)
        run: flutter build ios --config-only --release --no-codesign --no-tree-shake-icons

      - name: Build unsigned iOS app
        run: |
          set -eo pipefail
          LOG="$RUNNER_TEMP/xcodebuild.log"
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build 2>&1 | tee "$LOG"
          if ! grep -q "BUILD SUCCEEDED" "$LOG"; then
            echo "=== errors ==="
            grep -E "error:|The following build commands failed|Module .* not found" "$LOG" | head -40 || true
            echo "=== last 30 lines ==="
            tail -30 "$LOG"
            exit 1
          fi

      - name: Package unsigned IPA
        run: |
          set -eo pipefail
          APP=$(find "$RUNNER_TEMP/DerivedData" -name "Runner.app" -path "*/Release-iphoneos/*" | head -1)
          echo "Packaging: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "monolith.ipa" Payload
          rm -rf Payload

      - name: Upload IPA as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Monolith-iOS-unsigned
          path: monolith.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Extract app version
        id: app_version
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d '[:space:]')
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.app_version.outputs.tag }}
          name: "Monolith ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.app_version.outputs.tag }}"
          files: monolith.ipa
          fail_on_unmatched_files: true
          append_body: true
          body: |
            ## iOS — `monolith.ipa` (unsigned)

            - **App:** Monolith
            - **Version:** ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.app_version.outputs.tag }}
            - **Bundle ID:** `dev.naveed-gung.monolith`
            - **Developer:** naveed-gung

            This IPA is **not App Store signed**. Install via AltStore, Sideloadly, TrollStore, or
            any sideloading tool of your choice.

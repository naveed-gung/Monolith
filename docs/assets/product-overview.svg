<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">Monolith product surface</title>
  <desc id="desc">Three product surfaces — Library, Downloads, and Playback — sitting on one shared Flutter shell.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0A0C"/>
      <stop offset="1" stop-color="#121214"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FF4D5E"/>
      <stop offset="1" stop-color="#C23A48"/>
    </linearGradient>
    <filter id="shadow" x="-40" y="-40" width="1360" height="800" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="720" rx="36" fill="url(#bg)"/>
  <circle cx="1090" cy="120" r="180" fill="#FF4D5E" fill-opacity="0.06"/>
  <circle cx="170" cy="620" r="200" fill="#FF4D5E" fill-opacity="0.05"/>

  <g filter="url(#shadow)">
    <rect x="64" y="56" width="1152" height="608" rx="30" fill="#121214" stroke="#2C2C33"/>
  </g>

  <text x="100" y="130" fill="#F5F5F7" font-size="40" font-weight="800" letter-spacing="-0.5">Product surface</text>
  <text x="100" y="166" fill="#A2A2AC" font-size="19">Offline-first playback, one shared Flutter UI, platform-native media controls.</text>

  <!-- Card: Library -->
  <rect x="100" y="222" width="344" height="250" rx="24" fill="#1B1B1F" stroke="#2C2C33" stroke-width="1.5"/>
  <rect x="132" y="258" width="56" height="56" rx="15" fill="#FF4D5E" fill-opacity="0.16"/>
  <path d="M148 274h24M148 286h24M148 298h16" stroke="#FF4D5E" stroke-width="3" stroke-linecap="round"/>
  <text x="132" y="356" fill="#F5F5F7" font-size="26" font-weight="700">Library</text>
  <text x="132" y="388" fill="#A2A2AC" font-size="16">Import device audio, browse</text>
  <text x="132" y="410" fill="#A2A2AC" font-size="16">playlists, keep listening tidy.</text>
  <rect x="132" y="430" width="92" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06"/>
  <text x="178" y="450" text-anchor="middle" fill="#F5F5F7" font-size="14">Tracks</text>
  <rect x="234" y="430" width="104" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06"/>
  <text x="286" y="450" text-anchor="middle" fill="#F5F5F7" font-size="14">Playlists</text>

  <!-- Card: Downloads -->
  <rect x="468" y="222" width="344" height="250" rx="24" fill="#1B1B1F" stroke="#2C2C33" stroke-width="1.5"/>
  <rect x="500" y="258" width="56" height="56" rx="15" fill="#FF4D5E" fill-opacity="0.16"/>
  <path d="M528 270v26m0 0l-9 -9m9 9l9 -9M518 302h20" stroke="#FF4D5E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="500" y="356" fill="#F5F5F7" font-size="26" font-weight="700">Downloads</text>
  <text x="500" y="388" fill="#A2A2AC" font-size="16">Manage offline files, track</text>
  <text x="500" y="410" fill="#A2A2AC" font-size="16">downloader state and storage.</text>
  <rect x="500" y="430" width="74" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06"/>
  <text x="537" y="450" text-anchor="middle" fill="#F5F5F7" font-size="14">A–Z</text>
  <rect x="584" y="430" width="108" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06"/>
  <text x="638" y="450" text-anchor="middle" fill="#F5F5F7" font-size="14">Imported</text>

  <!-- Card: Playback -->
  <rect x="836" y="222" width="344" height="250" rx="24" fill="#1B1B1F" stroke="#2C2C33" stroke-width="1.5"/>
  <circle cx="1008" cy="300" r="44" fill="url(#accent)"/>
  <path d="M998 282l24 18l-24 18z" fill="#FFFFFF"/>
  <text x="868" y="356" fill="#F5F5F7" font-size="26" font-weight="700">Playback</text>
  <text x="868" y="388" fill="#A2A2AC" font-size="16">Animate the player, publish</text>
  <text x="868" y="410" fill="#A2A2AC" font-size="16">MediaItem, expose controls.</text>
  <rect x="868" y="430" width="124" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06"/>
  <text x="930" y="450" text-anchor="middle" fill="#F5F5F7" font-size="14">Lock screen</text>
  <rect x="1002" y="430" width="146" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06"/>
  <text x="1075" y="450" text-anchor="middle" fill="#F5F5F7" font-size="14">Android deck</text>

  <!-- connectors -->
  <path d="M444 347h24" stroke="#FF4D5E" stroke-width="3" stroke-linecap="round"/>
  <path d="M460 339l10 8l-10 8" stroke="#FF4D5E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M812 347h24" stroke="#FF4D5E" stroke-width="3" stroke-linecap="round"/>
  <path d="M828 339l10 8l-10 8" stroke="#FF4D5E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- footer -->
  <rect x="100" y="520" width="1080" height="112" rx="22" fill="#16161A" stroke="#2C2C33" stroke-width="1.5"/>
  <rect x="100" y="520" width="6" height="112" rx="3" fill="#FF4D5E"/>
  <text x="136" y="560" fill="#F5F5F7" font-size="20" font-weight="700">One shared Flutter shell</text>
  <text x="136" y="590" fill="#A2A2AC" font-size="16">A single controller orchestrates imports, downloads, playlists, playback and theme,</text>
  <text x="136" y="612" fill="#A2A2AC" font-size="16">while Android and iOS expose their native media surfaces.</text>
</svg>
